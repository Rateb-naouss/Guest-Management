    <script>
      // Gracefully ignore WebSocket / HMR connection errors per runtime environment guidelines
      window.addEventListener('error', function(e) {
        var msg = e && (e.message || '');
        var file = (e && e.filename) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('createWebSocketModuleRunnerTransport') !== -1 || file.indexOf('@vite/client') !== -1) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reasonStr = (e && e.reason) ? String(e.reason) : '';
        if (reasonStr.indexOf('WebSocket') !== -1 || reasonStr.indexOf('createWebSocketModuleRunnerTransport') !== -1) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
